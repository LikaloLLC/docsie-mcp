[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsie-mcp"
version = "0.1.0"
description = "Local stdio bridge for the hosted Docsie MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Docsie" }
]
keywords = ["docsie", "mcp", "model-context-protocol", "documentation", "video-to-docs"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.scripts]
docsie-mcp = "docsie_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/LikaloLLC/docsie-mcp"
Repository = "https://github.com/LikaloLLC/docsie-mcp"
Documentation = "https://github.com/LikaloLLC/docsie-mcp#readme"
Issues = "https://github.com/LikaloLLC/docsie-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["docsie_mcp"]
